name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@f72e64d2dc791ad5ceda145777a3922895d92a5d # 0.17.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: ccpbiosim_sphinx_theme
      lowest-dependencies-check: true
      test-path: tests/unit
      os: '["ubuntu-26.04", "macos-26", "windows-2025-vs2026"]'

  docs:
    name: Docs
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
    with:
      timeout-minutes: 15

  pre-commit:
    name: Pre-commit
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-pre-commit.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
    with:
      timeout-minutes: 15

  conda-build:
    name: Conda build
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
    with:
      python-versions: '["3.12"]'
      timeout-minutes: 45
