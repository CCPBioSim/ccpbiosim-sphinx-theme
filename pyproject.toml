[build-system]
requires = ["flit_core>=4,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "ccpbiosim-sphinx-theme"
dynamic = ["version"]

description = "Sphinx theme for CCPBioSim documentation, matching ccpbiosim.org"
maintainers = [
    {name = "Harry Swift", email = "harry.swift@stfc.ac.uk"}
]

readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Documentation :: Sphinx",
]

keywords = ["sphinx", "theme", "documentation", "ccpbiosim"]

dependencies = [
    "sphinx>=9.0,<10.0",
    "pydata-sphinx-theme>=0.23,<0.24",
    "sphinx-design>=0.7,<0.8",
    "sphinx-copybutton>=0.5,<1.0",
]

[project.urls]
Homepage = "https://github.com/CCPBioSim/ccpbiosim-sphinx-theme/"
Repository = "https://github.com/CCPBioSim/ccpbiosim-sphinx-theme.git"
Documentation = "https://ccpbiosim-sphinx-theme.readthedocs.io/"

# Lets Sphinx find the theme from `html_theme = "ccpbiosim_sphinx_theme"`.
[project.entry-points."sphinx.html_themes"]
ccpbiosim_sphinx_theme = "ccpbiosim_sphinx_theme"

#
# Optional dependency groups
#

[project.optional-dependencies]
testing = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "pytest-sugar>=1.1,<2.0"
]

pre-commit = [
    "pre-commit>=4.5,<5.0",
    "ruff>=0.15.2,<1.0",
    "pylint>=4.0,<5.0",
    "rstcheck>=6.2,<7.0"
]

docs = [
    "sphinx>=9,<10",
    "nbsphinx>=0.9,<1.0",
    "sphinx_copybutton>=0.5,<1.0",
    "furo>=2025.12.19,<2026.0",
    "markupsafe>=3.0,<4.0"
]

#
# Ruff configuration inside pyproject (recommended)
#

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

#
# Pytest configuration
#

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]

addopts = "-vv -ra"
